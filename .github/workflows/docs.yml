name: Documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'lib/**'
      - '*.gemspec'
      - 'README.md'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Generate YARD documentation
        run: |
          bundle exec yard doc
          ls -lah doc/

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v3
        with:
          name: documentation
          path: doc/
          retention-days: 30

  publish-docs:
    name: Publish Documentation
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Download documentation
        uses: actions/download-artifact@v3
        with:
          name: documentation
          path: doc/

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc
          force_orphan: true
        continue-on-error: true

      - name: Publish to devsite
        run: bundle exec rake kokoro:publish_docs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.DOCUPLOADER_SERVICE_ACCOUNT }}
        continue-on-error: true
